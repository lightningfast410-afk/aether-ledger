<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Ledger - Secure Control Panel</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { font-size: 28px; margin-bottom: 5px; }
        .subtitle { color: var(--text-muted); font-size: 14px; }
        .nav-bar {
            display: flex; gap: 20px; margin-top: 20px; border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        .nav-bar a {
            color: var(--text-muted); text-decoration: none; font-size: 14px; cursor: pointer;
            padding: 8px 12px; border-radius: 4px; transition: all 0.2s;
        }
        .nav-bar a.active { background: var(--accent-blue); color: #fff; }
        .section { display: none; }
        .section.active { display: block; }
        .panel {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 20px; margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px;
        }
        label { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
        input, select, textarea {
            background: var(--bg-color); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 10px; border-radius: 6px; font-size: 14px;
        }
        textarea { resize: vertical; min-height: 80px; font-family: monospace; }
        button {
            background: var(--accent-blue); color: #fff; border: none;
            padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer;
            transition: background 0.2s; font-size: 14px;
        }
        button:hover { background: #2563eb; }
        button.secondary {
            background: var(--accent-green); color: #fff;
        }
        button.secondary:hover { background: #059669; }
        button.danger {
            background: var(--accent-red); color: #fff;
        }
        button.danger:hover { background: #dc2626; }
        .alert {
            padding: 12px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 14px;
            display: none; animation: slideIn 0.3s ease-out;
        }
        .alert.error { background: #7f1d1d; border-left: 3px solid var(--accent-red); }
        .alert.success { background: #064e3b; border-left: 3px solid var(--accent-green); }
        .alert.info { background: #0c2340; border-left: 3px solid var(--accent-blue); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .block-card {
            background: var(--bg-color); border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-blue); border-radius: 6px; padding: 15px;
            margin-bottom: 10px; font-size: 13px;
        }
        .block-card.genesis { border-left-color: var(--accent-green); }
        .block-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .hash-mono {
            font-family: monospace; font-size: 12px; background: var(--bg-color);
            padding: 8px; border-radius: 4px; border: 1px solid var(--border-color);
            word-break: break-all; color: var(--text-muted);
        }
        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px; margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 6px; padding: 15px; text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: bold; color: var(--accent-blue); }
        .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-top: 5px; }
        table {
            width: 100%; border-collapse: collapse; font-size: 13px;
        }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: var(--bg-color); font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
        tr:hover { background: var(--bg-color); }
        .auth-section { display: none; }
        .auth-section.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔗 Aether Ledger</h1>
            <div class="subtitle">Secure Multi-Vertical Blockchain Ledger</div>
            <div class="nav-bar">
                <a onclick="showSection('dashboard')" class="nav-link active">Dashboard</a>
                <a onclick="showSection('identities')" class="nav-link">Identities</a>
                <a onclick="showSection('assets')" class="nav-link">Assets</a>
                <a onclick="showSection('transfer')" class="nav-link">Transfer</a>
                <a onclick="showSection('verify')" class="nav-link">Verify Chain</a>
                <a onclick="logout()" class="nav-link" style="margin-left: auto; color: var(--accent-red);">Logout</a>
            </div>
        </header>

        <!-- Auth Section -->
        <div id="authSection" class="auth-section show">
            <div class="panel">
                <h2>API Authentication</h2>
                <div class="form-group">
                    <label for="apiToken">Bearer Token (from server)</label>
                    <input type="password" id="apiToken" placeholder="Paste your API token here">
                </div>
                <button onclick="authenticate()">Connect</button>
            </div>
        </div>

        <!-- Main Content (hidden until auth) -->
        <div id="mainContent" style="display: none;">
            <!-- Dashboard -->
            <div id="dashboard" class="section active">
                <div class="stats" id="dashboardStats"></div>
                <div class="panel">
                    <h2>Recent Blocks</h2>
                    <div id="recentBlocks"></div>
                </div>
            </div>

            <!-- Identities -->
            <div id="identities" class="section">
                <div class="panel">
                    <h2>Create Identity</h2>
                    <div class="form-group">
                        <label for="identityName">Name</label>
                        <input type="text" id="identityName" placeholder="e.g., Acme Corp">
                    </div>
                    <div class="form-group">
                        <label for="identityRole">Role</label>
                        <select id="identityRole">
                            <option value="holder">Holder</option>
                            <option value="issuer">Issuer</option>
                            <option value="auditor">Auditor</option>
                        </select>
                    </div>
                    <button onclick="createIdentity()">Create</button>
                </div>
                <div class="panel">
                    <h2>Identities</h2>
                    <table><thead><tr><th>Name</th><th>Role</th><th>Created</th></tr></thead><tbody id="identitiesList"></tbody></table>
                </div>
            </div>

            <!-- Assets -->
            <div id="assets" class="section">
                <div class="panel">
                    <h2>Issue Asset</h2>
                    <div class="form-group">
                        <label for="assetVertical">Vertical</label>
                        <select id="assetVertical">
                            <option value="real_estate">Real Estate</option>
                            <option value="supply_chain">Supply Chain</option>
                            <option value="carbon_credits">Carbon Credits</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="assetName">Asset Name</label>
                        <input type="text" id="assetName" placeholder="e.g., Downtown Office Complex">
                    </div>
                    <div class="form-group">
                        <label for="assetIssuerId">Issuer ID</label>
                        <input type="text" id="assetIssuerId" placeholder="id_...">
                    </div>
                    <div class="form-group">
                        <label for="assetSupply">Supply</label>
                        <input type="number" id="assetSupply" placeholder="1000" step="0.01">
                    </div>
                    <button onclick="issueAsset()">Issue Asset</button>
                </div>
                <div class="panel">
                    <h2>Assets</h2>
                    <table><thead><tr><th>Name</th><th>Vertical</th><th>Supply</th><th>Circulating</th><th>Retired</th></tr></thead><tbody id="assetsList"></tbody></table>
                </div>
            </div>

            <!-- Transfer -->
            <div id="transfer" class="section">
                <div class="panel">
                    <h2>Transfer Asset</h2>
                    <div class="form-group">
                        <label for="transferAssetId">Asset ID</label>
                        <input type="text" id="transferAssetId" placeholder="ast_...">
                    </div>
                    <div class="form-group">
                        <label for="transferFrom">From (Identity ID)</label>
                        <input type="text" id="transferFrom" placeholder="id_...">
                    </div>
                    <div class="form-group">
                        <label for="transferTo">To (Identity ID)</label>
                        <input type="text" id="transferTo" placeholder="id_...">
                    </div>
                    <div class="form-group">
                        <label for="transferAmount">Amount</label>
                        <input type="number" id="transferAmount" placeholder="100" step="0.01">
                    </div>
                    <button onclick="executeTransfer()">Transfer</button>
                </div>
            </div>

            <!-- Verify -->
            <div id="verify" class="section">
                <div class="panel">
                    <h2>Chain Integrity</h2>
                    <button onclick="verifyChain()">Verify Full Chain</button>
                    <div id="verifyResult" style="margin-top: 15px;"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="alertContainer" style="position: fixed; top: 20px; right: 20px; max-width: 400px; z-index: 1000;"></div>

    <script>
        let apiToken = null;
        const apiBaseUrl = 'http://localhost:3000';

        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert ${type}`;
            alert.textContent = message;
            alert.style.display = 'block';
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        function authenticate() {
            const token = document.getElementById('apiToken').value.trim();
            if (!token) {
                showAlert('Please enter an API token', 'error');
                return;
            }
            apiToken = token;
            document.getElementById('authSection').classList.remove('show');
            document.getElementById('mainContent').style.display = 'block';
            loadDashboard();
        }

        function logout() {
            apiToken = null;
            document.getElementById('authSection').classList.add('show');
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('apiToken').value = '';
        }

        function showSection(name) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.target.classList.add('active');
            
            if (name === 'identities') loadIdentities();
            if (name === 'assets') loadAssets();
            if (name === 'dashboard') loadDashboard();
        }

        async function apiCall(endpoint, method = 'GET', body = null) {
            const options = {
                method,
                headers: {
                    'Authorization': `Bearer ${apiToken}`,
                    'Content-Type': 'application/json'
                }
            };
            if (body) options.body = JSON.stringify(body);
            
            const response = await fetch(`${apiBaseUrl}${endpoint}`, options);
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'API Error');
            }
            return response.json();
        }

        async function loadDashboard() {
            try {
                const [health, blocks, assets] = await Promise.all([
                    apiCall('/health'),
                    apiCall('/v1/blocks'),
                    apiCall('/v1/assets')
                ]);
                
                document.getElementById('dashboardStats').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${blocks.blocks.length}</div>
                        <div class="stat-label">Blocks</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${assets.assets.length}</div>
                        <div class="stat-label">Assets</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${health.integrity.valid ? '✓' : '✗'}</div>
                        <div class="stat-label">Chain Valid</div>
                    </div>
                `;
                
                const recent = blocks.blocks.slice(-5).reverse();
                document.getElementById('recentBlocks').innerHTML = recent.map(b => `
                    <div class="block-card ${b.index === 0 ? 'genesis' : ''}">
                        <div class="block-header"><strong>Block #${b.index}</strong><span>${new Date(b.timestamp).toLocaleString()}</span></div>
                        <div class="hash-mono" style="margin-bottom: 5px;"><strong>Hash:</strong> ${b.hash}</div>
                        <div class="hash-mono"><strong>Prev:</strong> ${b.previousHash}</div>
                    </div>
                `).join('');
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }

        async function createIdentity() {
            try {
                const name = document.getElementById('identityName').value;
                const role = document.getElementById('identityRole').value;
                if (!name) { showAlert('Name required', 'error'); return; }
                
                const result = await apiCall('/v1/identities', 'POST', { name, role });
                showAlert(`Identity created: ${result.identity.id}`, 'success');
                document.getElementById('identityName').value = '';
                loadIdentities();
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }

        async function loadIdentities() {
            try {
                const result = await apiCall('/v1/identities');
                document.getElementById('identitiesList').innerHTML = result.identities.map(i => `
                    <tr><td>${i.name}</td><td>${i.role}</td><td>${new Date(i.createdAt).toLocaleDateString()}</td></tr>
                `).join('');
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }

        async function issueAsset() {
            try {
                const data = {
                    vertical: document.getElementById('assetVertical').value,
                    name: document.getElementById('assetName').value,
                    issuerId: document.getElementById('assetIssuerId').value,
                    supply: parseFloat(document.getElementById('assetSupply').value)
                };
                if (!data.name || !data.issuerId || !data.supply) {
                    showAlert('All fields required', 'error');
                    return;
                }
                
                const result = await apiCall('/v1/assets', 'POST', data);
                showAlert(`Asset issued: ${result.asset.id}`, 'success');
                document.getElementById('assetName').value = '';
                loadAssets();
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }

        async function loadAssets() {
            try {
                const result = await apiCall('/v1/assets');
                document.getElementById('assetsList').innerHTML = result.assets.map(a => `
                    <tr><td>${a.name}</td><td>${a.vertical}</td><td>${a.supply}</td><td>${a.circulatingSupply}</td><td>${a.retiredSupply}</td></tr>
                `).join('');
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }

        async function executeTransfer() {
            try {
                const data = {
                    assetId: document.getElementById('transferAssetId').value,
                    from: document.getElementById('transferFrom').value,
                    to: document.getElementById('transferTo').value,
                    amount: parseFloat(document.getElementById('transferAmount').value)
                };
                if (!data.assetId || !data.from || !data.to || !data.amount) {
                    showAlert('All fields required', 'error');
                    return;
                }
                
                const result = await apiCall('/v1/transfers', 'POST', data);
                showAlert(`Transfer completed: ${result.transaction.id}`, 'success');
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }

        async function verifyChain() {
            try {
                const result = await apiCall('/v1/verify');
                document.getElementById('verifyResult').innerHTML = `
                    <div class="alert ${result.valid ? 'success' : 'error'}" style="display: block;">
                        <strong>${result.valid ? '✓ Chain Valid' : '✗ Chain Invalid'}</strong>
                        <br>Length: ${result.length} blocks
                        ${result.reason ? `<br>Issue: ${result.reason}` : ''}
                    </div>
                `;
            } catch (error) {
                showAlert(error.message, 'error');
            }
        }
    </script>
</body>
</html>
